name: Setup Base Dependencies
description: Setup base dependencies
inputs:
  platform:
    required: true
    description: Target platform.
runs:
  using: "composite"
  steps:
    - name: Setup Python 3.x
      uses: actions/setup-python@v5
      with:
        python-version: 3.x

    # The one SCons pin. Keep it in sync with CLAUDE.md and README.md (local builds use the same version).
    - name: Setup SCons 4.11.1
      shell: bash
      run: |
        python -c "import sys; print(sys.version)"
        python -m pip install scons==4.11.1
        python -m SCons --version

    - name: Setup Android Dependencies
      if: inputs.platform == 'android'
      uses: nttld/setup-ndk@v1
      with:
        # godot-cpp 10 expects NDK 28.1.13356709 (r28b)
        ndk-version: r28b
        link-to-sdk: true

    - name: Setup Web Dependencies
      if: inputs.platform == 'web'
      uses: mymindstorm/setup-emsdk@v14
      with:
        version: 3.1.64
        no-cache: true

    - name: Verify Emscripten setup
      if: inputs.platform == 'web'
      shell: bash
      run: |
        emcc -v
