name: 🛠️ Build All
on: 
    push:
        tags:
          - '*'
    pull_request:
        paths: [ '**' ]
    workflow_dispatch:
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }} ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        identifier: [linux, windows, macos, ios, android-arm32, android-arm64, web-nothreads]
        target: [debug, release]
        include:
          - identifier: linux
            platform: linux
            name: 🐧 Linux
            runner: ubuntu-22.04
            flags: arch=x86_64
            
          - identifier: windows
            platform: windows
            name: 🪟 Windows
            runner: ubuntu-22.04
            flags: arch=x86_64

          - identifier: macos
            platform: macos
            name: 🍎 macOS
            runner: macos-latest
            flags: arch=universal

          - identifier: ios
            platform: ios
            name: 🍏 iOS
            runner: macos-latest
            flags: arch=universal

          - identifier: android-arm32
            platform: android
            name: 🤖 Android Arm32
            runner: ubuntu-22.04
            flags: arch=arm32

          - identifier: android-arm64
            platform: android
            name: 🤖 Android Arm64
            runner: ubuntu-22.04
            flags: arch=arm64

          - identifier: web-nothreads
            platform: web
            name: 🌐 Web No-threads
            runner: ubuntu-22.04
            flags: threads=no
    steps:
      - name: Checkout Godot Synth
        uses: actions/checkout@v4
        with:
          submodules: recursive
        
      - name: Setup Base Dependencies
        uses: ./.github/actions/base-deps
        with:
            platform: ${{ matrix.platform }}

      - name: Setup Build Cache
        uses: ./.github/actions/build-cache
        with:
          cache-name: ${{ matrix.identifier }}-${{ matrix.target }}
        continue-on-error: true

      - name: Build Godot Synth
        env:
            SCONS_CACHE: "${{ github.workspace }}/.scons-cache/"
            TARGET: 'template_${{ matrix.target }}'
        shell: sh
        run: |
            scons target=$TARGET platform='${{ matrix.platform }}' ${{ matrix.flags }} debug_symbols=no -j2

      - name: Strip Libraries (Windows/Linux)
        if: ${{ matrix.platform == 'windows' || matrix.platform == 'linux' }}
        shell: sh
        run: |
          ls -l project/addons/godot_synth/bin/
          strip project/addons/godot_synth/bin/libgodot_synth.*
          ls -l project/addons/godot_synth/bin/

      # Guard against stub libraries (#20): fail if the library for this job is
      # missing, suspiciously small, or doesn't contain the GDExtension entry
      # symbol (a library built from zero sources has neither).
      - name: Verify Library
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          MIN_BYTES: 204800
        run: |
          set -euo pipefail
          mapfile -t libs < <(find project/addons/godot_synth/bin -type f -name "libgodot_synth.*.${TARGET}*")
          if [ "${#libs[@]}" -eq 0 ]; then
            echo "::error::No ${TARGET} library found in project/addons/godot_synth/bin"
            exit 1
          fi
          status=0
          for lib in "${libs[@]}"; do
            size=$(wc -c < "$lib")
            hits=$(LC_ALL=C grep -c -a synth_library_init "$lib" || true)
            echo "$lib: $size bytes, synth_library_init matches: $hits"
            if [ "$size" -lt "$MIN_BYTES" ]; then
              echo "::error file=$lib::Library is only $size bytes (< $MIN_BYTES). Looks like a stub built without sources (#20)."
              status=1
            fi
            if [ "$hits" -eq 0 ]; then
              echo "::error file=$lib::Library does not contain synth_library_init (#20)."
              status=1
            fi
            if command -v nm >/dev/null && file "$lib" | grep -q 'ELF.*x86-64'; then
              nm -D --defined-only "$lib" | grep -w synth_library_init || { echo "::error file=$lib::synth_library_init is not an exported dynamic symbol"; status=1; }
            fi
          done
          exit $status

      - name: Include Files
        shell: sh
        run: |
          cp '${{ github.workspace }}/README.md' '${{ github.workspace }}/LICENSE' ${{ github.workspace }}/project/addons/godot_synth/

      - name: Upload Package
        uses: actions/upload-artifact@v4
        with:
          include-hidden-files: true
          name: godot-synth-${{ matrix.identifier }}-${{ matrix.target }}
          path: |
            ${{ github.workspace }}/project/

  merge:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Merge Artifacts
        uses: actions/upload-artifact/merge@v4
        with:
          include-hidden-files: true
          name: ${{ github.event.repository.name }}
          pattern: godot-synth-*
          delete-merged: true

  release:
    # Only publish a GitHub release for tag pushes, never for PRs (#20).
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: merge
    permissions:
        contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Merged Artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ github.event.repository.name }}
          path: ./release_artifact

      - name: Debug Artifact Structure
        run: |
          find . -type f | sort
          ls -la
       

      - name: Create ZIP Archive
        run: |
          cd ./release_artifact
          zip -r ../${{ github.event.repository.name }}-${{ github.ref_name }}.zip ./*
          cd ..
          ls -la
                                                                                                                                                  
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: Godot Synth ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: ${{ github.event.repository.name }}-${{ github.ref_name }}.zip
